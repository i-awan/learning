apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    app: myapp
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "myapp-role"
    vault.hashicorp.com/agent-inject-secret-config: "secret/myapp/database"  # Secret path
    vault.hashicorp.com/agent-inject-template-config: |
      {{- with secret "secret/myapp/database" -}}
      export DB_USERNAME="{{ .Data.data.username }}"
      export DB_PASSWORD="{{ .Data.data.password }}"
      {{- end }}
spec:
  serviceAccountName: myapp-sa
  containers:
    - name: myapp-nginx
      image: nginx
      ports:
        - containerPort: 80
      command: ["/bin/sh", "-c"]  # Override default entrypoint to run a custom script
      args:
        - |
          # Export secrets to environment variables
          . /vault/secrets/config
          
          # Create an index.html file containing the secrets
          echo "<html><body><h1>Secrets Injected:</h1>" > /usr/share/nginx/html/index.html
          echo "<p>DB_USERNAME: $DB_USERNAME</p>" >> /usr/share/nginx/html/index.html
          echo "<p>DB_PASSWORD: $DB_PASSWORD</p>" >> /usr/share/nginx/html/index.html
          echo "</body></html>" >> /usr/share/nginx/html/index.html

          # Start nginx server
          exec nginx -g "daemon off;"
