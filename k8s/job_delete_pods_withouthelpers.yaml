apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cleanup
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "100"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-cleanup
      restartPolicy: Never
      containers:
        - name: kubectl
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -ceu
            - |
              set -o pipefail

              NS="{{ .Release.Namespace }}"
              DEPLOY="{{ .Release.Name }}-{{ .Chart.Name }}"
              SELECTOR='app.kubernetes.io/name={{ .Chart.Name }},app.kubernetes.io/instance={{ .Release.Name }}'

              ROLLOUT_TIMEOUT='{{ default "10m" .Values.cleanup.rolloutTimeout }}'
              SETTLE_SECONDS={{ default 30 .Values.cleanup.settleSeconds }}
              POLL_INTERVAL={{ default 10 .Values.cleanup.pollIntervalSeconds }}
              MAX_WAIT={{ default 300 .Values.cleanup.maxWaitSeconds }}

              echo "Waiting for rollout of deployment/$DEPLOY..."
              kubectl -n "$NS" rollout status deploy/"$DEPLOY" --timeout="$ROLLOUT_TIMEOUT" || true

              echo "Initial settle for $SETTLE_SECONDS seconds..."
              sleep "$SETTLE_SECONDS"

              echo "Polling up to $MAX_WAIT seconds for pods to reach phase=Running..."
              start_ts=$(date +%s)
              while true; do
                NOT_RUNNING=$(kubectl -n "$NS" get pods -l $SELECTOR -o jsonpath='{range .items[*]}{.metadata.name} {.status.phase}{"\n"}{end}' \
                  | awk '$2!="Running"{print $1}')

                if [[ -z "$NOT_RUNNING" ]]; then
                  echo "✅ All pods are Running. Nothing to delete."
                  exit 0
                fi

                now_ts=$(date +%s); elapsed=$(( now_ts - start_ts ))
                if (( elapsed >= MAX_WAIT )); then
                  echo "⏰ Timeout ($elapsed s). Deleting pods not in Running phase:"
                  echo "$NOT_RUNNING" | sed 's/^/ - /'
                  echo "$NOT_RUNNING" | xargs -r -n1 kubectl -n "$NS" delete pod --wait=false --grace-period=0
                  exit 0
                fi

                echo "Waiting... (elapsed ${elapsed}s). Not Running:"
                echo "$NOT_RUNNING" | sed 's/^/ - /'
                sleep "$POLL_INTERVAL"
              done
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cleanup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cleanup
