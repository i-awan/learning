apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cleanup
rules:
- apiGroups: [""]       # pods
  resources: ["pods"]
  verbs: ["get","list","delete"]
- apiGroups: ["apps"]   # deployments for rollout status
  resources: ["deployments"]
  verbs: ["get","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cleanup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cleanup-{{ .Release.Revision }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ default 300 .Values.cleanup.jobDeadlineSeconds }}    # hard cap
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-cleanup
      restartPolicy: Never
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -ceu
        - |
          set -o pipefail

          NS="{{ .Release.Namespace }}"
          # ⬇️ Update selector if your labels differ
          SELECTOR='app.kubernetes.io/name={{ .Chart.Name }},app.kubernetes.io/instance={{ .Release.Name }}'

          SETTLE={{ default 30 .Values.cleanup.settleSeconds }}
          POLL={{ default 10 .Values.cleanup.pollIntervalSeconds }}
          MAX={{ default 120 .Values.cleanup.maxWaitSeconds }}

          echo "Selector: $SELECTOR"
          echo "Initial settle: ${SETTLE}s"
          sleep "$SETTLE"

          start=$(date +%s)
          while true; do
            echo "Checking pod phases..."
            kubectl -n "$NS" get pods -l "$SELECTOR" -o wide || true

            # capture pods not in Running
            NOT_RUNNING=$(kubectl -n "$NS" get pods -l "$SELECTOR" -o jsonpath='{range .items[*]}{.metadata.name} {.status.phase}{"\n"}{end}' \
              | awk '$2!="Running"{print $1}')

            if [[ -z "$NOT_RUNNING" ]]; then
              echo "✅ All pods are Running; nothing to delete."
              exit 0
            fi

            elapsed=$(( $(date +%s) - start ))
            if (( elapsed >= MAX )); then
              echo "⏰ Waited ${elapsed}s; deleting pods not in Running:"
              echo "$NOT_RUNNING" | sed 's/^/ - /'
              echo "$NOT_RUNNING" | xargs -r -n1 kubectl -n "$NS" delete pod --wait=false --grace-period=0
              echo "Done."
              exit 0
            fi

            echo "Still not Running (elapsed ${elapsed}s). Waiting ${POLL}s…"
            echo "$NOT_RUNNING" | sed 's/^/ - /'
            sleep "$POLL"
          done

# cleanup:
#   jobDeadlineSeconds: 300   # hard cap for the job itself
#   settleSeconds: 30         # initial grace for slow init/mounts
#   pollIntervalSeconds: 10
#   maxWaitSeconds: 120       # after this, delete non-Running pods

