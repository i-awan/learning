apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-cleanup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-cleanup
rules:
- apiGroups: [""]       # pods
  resources: ["pods"]
  verbs: ["get","list","delete"]
- apiGroups: ["apps"]   # deployments for rollout status
  resources: ["deployments"]
  verbs: ["get","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-cleanup
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-cleanup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cleanup-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ default 600 .Values.cleanup.jobDeadlineSeconds }}   # hard cap
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-cleanup
      restartPolicy: Never
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -ceu
        - |
          set -o pipefail

          NS="{{ .Release.Namespace }}"
          SELECTOR='app.kubernetes.io/name={{ .Chart.Name }},app.kubernetes.io/instance={{ .Release.Name }}'

          ROLLOUT_TIMEOUT='{{ default "10m" .Values.cleanup.rolloutTimeout }}'
          SETTLE_SECONDS={{ default 30 .Values.cleanup.settleSeconds }}
          POLL_INTERVAL={{ default 10 .Values.cleanup.pollIntervalSeconds }}
          MAX_WAIT={{ default 300 .Values.cleanup.maxWaitSeconds }}

          echo "Finding deployments with selector: $SELECTOR"
          DEPLOYS=$(kubectl -n "$NS" get deploy -l "$SELECTOR" -o name)
          if [[ -z "$DEPLOYS" ]]; then
            echo "No deployments found for selector; exiting."
            exit 0
          fi

          echo "Waiting for rollout on:"
          echo "$DEPLOYS" | sed 's/^/ - /'
          echo "$DEPLOYS" | xargs -r -n1 kubectl -n "$NS" rollout status --timeout="$ROLLOUT_TIMEOUT" || true

          echo "Initial settle for ${SETTLE_SECONDS}s…"
          sleep "$SETTLE_SECONDS"

          echo "Polling up to ${MAX_WAIT}s for pods to reach phase=Running…"
          start_ts=$(date +%s)
          while true; do
            NOT_RUNNING=$(kubectl -n "$NS" get pods -l "$SELECTOR" -o jsonpath='{range .items[*]}{.metadata.name} {.status.phase}{"\n"}{end}' \
              | awk '$2!="Running"{print $1}')

            if [[ -z "$NOT_RUNNING" ]]; then
              echo "✅ All pods are Running. Nothing to delete."
              exit 0
            fi

            elapsed=$(( $(date +%s) - start_ts ))
            if (( elapsed >= MAX_WAIT )); then
              echo "⏰ Timeout (${elapsed}s). Deleting pods not in Running phase:"
              echo "$NOT_RUNNING" | sed 's/^/ - /'
              echo "$NOT_RUNNING" | xargs -r -n1 kubectl -n "$NS" delete pod --wait=false --grace-period=0
              exit 0
            fi

            echo "Waiting… (${elapsed}s). Not Running:"
            echo "$NOT_RUNNING" | sed 's/^/ - /'
            sleep "$POLL_INTERVAL"
          done



# cleanup:
